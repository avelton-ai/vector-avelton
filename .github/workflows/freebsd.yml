name: FreeBSD
'on':
  workflow_dispatch: {}
concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  freebsd:
    name: FreeBSD 14 (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - name: Build and test in a FreeBSD VM
      uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
      with:
        release: '14.3'
        usesh: true
        cpu: 4
        mem: 12288
        copyback: false
        prepare: |
          pkg install -y git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
        run: |
          . "$HOME/.cargo/env"
          # The checkout is synced in under another owner; let tests that call git read it.
          git config --global --add safe.directory "*"
          rustc --version
          # The checkout above is synced into the VM with the workspace.
          export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --workspace --all-targets --locked
          CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked
  package:
    name: FreeBSD 14 (package)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: storytold/craft-fonts
        ref: abb83316d96aa59c1cf64784289e378fe9fa5695
        path: craft-fonts
    - name: Package in a FreeBSD VM
      uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
      with:
        release: '14.3'
        usesh: true
        mem: 12288
        prepare: |
          pkg install -y bash curl git pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        run: |
          . "$HOME/.cargo/env"
          git config --global --add safe.directory "$PWD"
          # Build outside the checkout so only dist/ is copied back out of the VM.
          # The craft-fonts checkout is synced into the VM with the workspace.
          export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1
          export CARGO_TARGET_DIR=/var/tmp/vectorcraft-target CARGO_BUILD_JOBS=4
          bash packaging/freebsd/package.sh
          # Every part the package must have, the craft-fonts licences included.
          tar -tzf dist/release/vectorcraft-*-freebsd-x86_64.tar.gz >/var/tmp/contents.txt
          for want in '/bin/vectorcraft$' '/bin/vectorcraft-cli$' '/share/applications/.*\.desktop$' '/share/icons/hicolor/' '/share/doc/vectorcraft/NOTICE$' '/share/doc/vectorcraft/OFL-.*\.txt$'; do
            grep -Eq "$want" /var/tmp/contents.txt || { echo "missing from the package: $want"; exit 1; }
          done
    - uses: actions/upload-artifact@v4
      with:
        name: freebsd-package
        path: dist/release/*
        if-no-files-found: error
