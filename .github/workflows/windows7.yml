name: Windows 7 x64 compatibility
'on':
  schedule:
  - cron: 23 5 * * 1
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: nightly-2026-10-01
        components: rust-src
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        key: windows7-x64
    - name: Build, check and test the portable package
      shell: pwsh
      run: ./packaging/windows/windows7.ps1 -Test
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: vectorcraft-windows7-x64-portable
        path: dist/release/vectorcraft-windows7-x64-portable.zip
        if-no-files-found: error
