name: Avelton quality gates
'on':
  workflow_call: {}
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Native dependencies
      run: |-
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev libxcb-shape0-dev libxcb-xfixes0-dev
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt,clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        key: avelton-quality
        cache-on-failure: true
    - name: Full upstream quality gates
      run: cargo xtask ci
